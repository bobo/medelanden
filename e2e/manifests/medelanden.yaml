---
apiVersion: v1
kind: Namespace
metadata:
  name: medelanden
---
apiVersion: v1
kind: Service
metadata:
  name: medelanden-headless
  namespace: medelanden
  labels:
    app: medelanden
spec:
  clusterIP: None
  selector:
    app: medelanden
  ports:
    - name: client
      port: 4222
      targetPort: 4222
    - name: peer
      port: 4223
      targetPort: 4223
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: medelanden
  namespace: medelanden
  labels:
    app: medelanden
spec:
  type: ClusterIP
  selector:
    app: medelanden
  ports:
    - name: client
      port: 4222
      targetPort: 4222
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: medelanden
  namespace: medelanden
  labels:
    app: medelanden
spec:
  serviceName: medelanden-headless
  replicas: 3
  selector:
    matchLabels:
      app: medelanden
  template:
    metadata:
      labels:
        app: medelanden
    spec:
      terminationGracePeriodSeconds: 5
      containers:
        - name: medelanden
          image: medelanden:test
          imagePullPolicy: Never
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - name: client
              containerPort: 4222
            - name: peer
              containerPort: 4223
            - name: http
              containerPort: 8080
          args:
            - "--bind=0.0.0.0:4222"
            - "--peer-addr=0.0.0.0:4223"
            - "--advertise-peer-addr=$(POD_NAME).medelanden-headless.medelanden.svc.cluster.local:4223"
            - "--http=0.0.0.0:8080"
            - "--data-dir=/data"
            - "--seeds=medelanden-0.medelanden-headless.medelanden.svc.cluster.local:4223,medelanden-1.medelanden-headless.medelanden.svc.cluster.local:4223,medelanden-2.medelanden-headless.medelanden.svc.cluster.local:4223"
            - '--stream={"name":"test","subjects":["test.>"],"replication_target":2,"fsync_policy":"interval","fsync_interval":100000000}'
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 256Mi
